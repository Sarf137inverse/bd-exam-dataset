    seq: 1
    question: "$\\begin{bmatrix} x-3 & 2 \\\\ 4 & x-5 \\end{bmatrix}$ একটি ব্যতিক্রমী ম্যাট্রিক্স হলে $x$ এর মান কত?"
    options:
      a: "$1, 7$"
      b: "$-1, 7$"
      c: "$1, -7$"
      d: "$-1, -7$"
