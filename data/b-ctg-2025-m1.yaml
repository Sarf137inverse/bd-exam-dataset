  - id: b-ctg-2025-m1-mcq-002
    seq: 2
    question: "$A = \\begin{bmatrix} 1 & 2 \\\\ 3 & 4 \\end{bmatrix}$ এবং $B = \\begin{bmatrix} 5 & 6 \\\\ 7 & 8 \\end{bmatrix}$ হলে, $AB$ এর (1,2)-তম ভুক্তি কোনটি?"
